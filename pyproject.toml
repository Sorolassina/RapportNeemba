[project]
name = "nemba-report"
version = "0.1.0"
description = "NEMBA GROUP – Générateur de rapports de formation"
requires-python = ">=3.8"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "python-multipart==0.0.18",
    "jinja2==3.1.2",
    "pydantic==2.5.0",
    "reportlab==4.0.7",
    "pandas==2.1.4",
    "matplotlib==3.8.2",
    "seaborn==0.13.0",
    "openpyxl==3.1.2",
    "pillow==10.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"