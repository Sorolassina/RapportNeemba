<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LiuGong Academy</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;600;700&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet"/>

<style>
  /* Material Symbols Outlined : auto-hébergé localement */
  @font-face {
    font-family: 'Material Symbols Outlined';
    font-style: normal;
    font-weight: 100 700;
    font-display: block;
    src: url("{{ url_for('static', path='fonts/MaterialSymbolsOutlined.woff2') }}") format('woff2-variations'),
         url("{{ url_for('static', path='fonts/MaterialSymbolsOutlined.woff2') }}") format('woff2');
  }
</style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=block" rel="stylesheet"/>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000000;
    overflow: hidden;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    color: #ffffff;
  }

  /* ============================================================
     SCÈNE
     ============================================================ */
  .scene {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #0d0d0d 0%, #000000 80%);
    overflow: hidden;
  }
  .scene.is-leaving {
    animation: scene-exit 1s cubic-bezier(0.7, 0, 0.3, 1) forwards;
  }
  @keyframes scene-exit {
    0%   { opacity: 1; transform: scale(1); filter: brightness(1); }
    50%  { opacity: 1; filter: brightness(1.4); }
    100% { opacity: 0; transform: scale(1.08); filter: brightness(2); }
  }

  /* ============================================================
     COUCHES DE FOND
     ============================================================ */

  /* Bandes de sécurité (warning stripes) */
  .stripe {
    position: absolute;
    left: 0; right: 0;
    height: 28px;
    background-image: repeating-linear-gradient(
      45deg,
      #EC6606 0 22px,
      #000000 22px 44px
    );
    z-index: 4;
  }
  .stripe.top    { top: 0;    transform: translateY(-100%); animation: stripe-top 0.7s 0.2s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
  .stripe.bottom { bottom: 0; transform: translateY(100%);  animation: stripe-bot 0.7s 0.2s cubic-bezier(0.7, 0, 0.3, 1) forwards; }
  @keyframes stripe-top { to { transform: translateY(0); } }
  @keyframes stripe-bot { to { transform: translateY(0); } }

  /* Grille technique */
  .grid {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, rgba(236, 102, 6, 0.07) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(236, 102, 6, 0.07) 1px, transparent 1px);
    background-size: 56px 56px;
    opacity: 0;
    animation: grid-in 1s 0.4s ease-out forwards;
    z-index: 1;
  }
  @keyframes grid-in {
    to { opacity: 1; }
  }

  /* Halo radial jaune au centre */
  .halo {
    position: absolute;
    top: 50%; left: 50%;
    width: 800px; height: 800px;
    transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle, rgba(236, 102, 6, 0.18) 0%, transparent 60%);
    border-radius: 50%;
    z-index: 2;
    animation: halo-pulse 5s 0.5s ease-out forwards;
  }
  @keyframes halo-pulse {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0; }
    25%  { transform: translate(-50%, -50%) scale(0.5); opacity: 0.6; }
    100% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.4; }
  }

  /* Engrenages décoratifs (4 coins) */
  .gear {
    position: absolute;
    fill: none;
    stroke: #EC6606;
    stroke-width: 1.2;
    opacity: 0;
    z-index: 2;
  }
  .gear.g1 { top: 6%;     left: 5%;    width: 240px; height: 240px;
             animation: gear-fade 1.2s 0.7s ease-out forwards, spin 14s 0.7s linear infinite; }
  .gear.g2 { top: 8%;     right: 6%;   width: 180px; height: 180px;
             animation: gear-fade 1.2s 0.9s ease-out forwards, spin-rev 11s 0.9s linear infinite; }
  .gear.g3 { bottom: 10%; left: 8%;    width: 200px; height: 200px;
             animation: gear-fade 1.2s 1.1s ease-out forwards, spin-rev 13s 1.1s linear infinite; }
  .gear.g4 { bottom: 6%;  right: 5%;   width: 260px; height: 260px;
             animation: gear-fade 1.2s 1.3s ease-out forwards, spin 16s 1.3s linear infinite; }
  @keyframes gear-fade { to { opacity: 0.20; } }
  @keyframes spin     { to { transform: rotate(360deg); } }
  @keyframes spin-rev { to { transform: rotate(-360deg); } }

  /* Particules de lumière (bokeh jaune) */
  .particle {
    position: absolute;
    width: 4px; height: 4px;
    background: #EC6606;
    border-radius: 50%;
    box-shadow: 0 0 6px #EC6606;
    z-index: 3;
    opacity: 0;
    animation: particle-float var(--dur, 8s) var(--delay, 0s) ease-out infinite;
  }
  @keyframes particle-float {
    0%   { transform: translateY(20vh) translateX(0); opacity: 0; }
    20%  { opacity: 1; }
    80%  { opacity: 1; }
    100% { transform: translateY(-110vh) translateX(var(--drift, 30px)); opacity: 0; }
  }

  /* ============================================================
     PANNEAU CENTRAL
     ============================================================ */
  .stage {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }

  .panel {
    position: relative;
    width: min(620px, 92vw);
    padding: 56px 44px 40px;
    background: linear-gradient(145deg, #141414 0%, #050505 100%);
    border: 2px solid #1f1f1f;
    box-shadow:
      0 0 0 4px #000,
      0 30px 100px rgba(236, 102, 6, 0.10),
      inset 0 1px 0 rgba(255, 255, 255, 0.05);
    transform: scale(0.85) rotate(-1deg);
    opacity: 0;
    animation: panel-in 0.9s 0.6s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
  }
  @keyframes panel-in {
    to { transform: scale(1) rotate(0); opacity: 1; }
  }

  /* Bandes de sécurité internes (haut & bas du panneau) */
  .panel::before,
  .panel::after {
    content: "";
    position: absolute;
    left: 0; right: 0;
    height: 12px;
    background-image: repeating-linear-gradient(
      45deg,
      #EC6606 0 14px,
      #000 14px 28px
    );
  }
  .panel::before { top: 0; }
  .panel::after  { bottom: 0; }

  /* Rivets */
  .rivet {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #888 0%, #2a2a2a 50%, #000 100%);
    box-shadow: inset 0 -1px 1px rgba(0,0,0,.7), 0 1px 1px rgba(255,255,255,.05);
    z-index: 2;
  }
  .rivet.tl { top: 22px;    left: 16px; }
  .rivet.tr { top: 22px;    right: 16px; }
  .rivet.bl { bottom: 22px; left: 16px; }
  .rivet.br { bottom: 22px; right: 16px; }

  /* ============================================================
     CONTENU DU PANNEAU
     ============================================================ */
  .id-tag {
    font-family: "IBM Plex Mono", "IBM Plex Sans", monospace;
    font-size: 10px;
    color: #EC6606;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 24px;
    opacity: 0;
    animation: fade-up 0.5s 1.0s ease-out forwards;
  }
  .id-tag::before,
  .id-tag::after {
    content: "·····";
    color: #4a4a4a;
    margin: 0 12px;
  }

  /* Logo wrapper avec sweep laser */
  .logo-wrap {
    position: relative;
    width: 100%;
    height: 110px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .logo {
    height: 110px;
    width: 100%;
    object-fit: contain;
    filter: brightness(0) invert(1);
    opacity: 0;
    animation: logo-reveal 0.8s 1.2s cubic-bezier(0.7, 0, 0.3, 1) forwards;
  }
  @keyframes logo-reveal {
    0%   { opacity: 0; clip-path: inset(0 100% 0 0); }
    100% { opacity: 1; clip-path: inset(0 0 0 0); }
  }
  .laser {
    position: absolute;
    top: 0;
    left: -3px;
    width: 4px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, #EC6606 20%, #FF8A3D 50%, #EC6606 80%, transparent);
    box-shadow: 0 0 20px #EC6606, 0 0 40px rgba(236, 102, 6, 0.6);
    opacity: 0;
    animation: laser-sweep 1s 1.2s ease-out forwards;
  }
  @keyframes laser-sweep {
    0%   { left: -3px;  opacity: 1; }
    90%  { opacity: 1; }
    100% { left: calc(100% + 3px); opacity: 0; }
  }

  .title {
    font-family: "Archivo Narrow", sans-serif;
    font-weight: 700;
    font-size: 38px;
    letter-spacing: 0.20em;
    color: #ffffff;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 8px;
    opacity: 0;
    animation: fade-up 0.6s 1.8s ease-out forwards;
  }
  .title .accent {
    color: #EC6606;
  }

  .subtitle {
    font-family: "IBM Plex Sans", sans-serif;
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.40em;
    color: #cfcfcf;
    text-transform: uppercase;
    text-align: center;
    margin-bottom: 36px;
    opacity: 0;
    animation: fade-up 0.6s 2.0s ease-out forwards;
  }

  @keyframes fade-up {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Barre de progression */
  .progress {
    position: relative;
    width: 100%;
    height: 8px;
    background: #1a1a1a;
    border: 1px solid #2a2a2a;
    overflow: hidden;
    margin-bottom: 14px;
  }
  .progress-fill {
    position: absolute;
    inset: 0;
    width: 0%;
    background: linear-gradient(to right, #EC6606 0%, #FF8A3D 50%, #EC6606 100%);
    box-shadow: 0 0 10px rgba(236, 102, 6, 0.7);
    animation: progress-fill 2.6s 1.4s cubic-bezier(0.7, 0, 0.3, 1) forwards;
  }
  .progress-tick {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: #4a4a4a;
  }
  @keyframes progress-fill {
    0%   { width: 0%; }
    100% { width: 100%; }
  }

  /* Métadonnées techniques */
  .meta {
    display: flex;
    justify-content: space-between;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: #EC6606;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    opacity: 0;
    animation: fade-up 0.5s 1.6s ease-out forwards;
  }
  .meta span {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .meta b {
    color: #ffffff;
    font-weight: 600;
  }
  .meta .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: #EC6606;
    border-radius: 50%;
    box-shadow: 0 0 6px #EC6606;
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0.3; }
  }

  /* ============================================================
     TICKER BAS DE PAGE
     ============================================================ */
  .ticker {
    position: absolute;
    bottom: 44px;
    left: 0; right: 0;
    text-align: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 11px;
    color: #888;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    z-index: 5;
    opacity: 0;
    animation: fade-up 0.6s 2.4s ease-out forwards;
  }
  .ticker .pulse {
    color: #EC6606;
    animation: blink 1s ease-in-out infinite;
  }

  /* Skip button (en haut à droite, discret) */
  .skip {
    position: absolute;
    top: 44px;
    right: 30px;
    z-index: 20;
    background: transparent;
    color: #888;
    border: 1px solid #333;
    padding: 6px 12px;
    font-family: "IBM Plex Sans", sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0;
    animation: fade-up 0.4s 0.5s ease-out forwards;
  }
  .skip:hover {
    color: #000;
    background: #EC6606;
    border-color: #EC6606;
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */

  /* Tablette ≤ 1024px : engrenages plus discrets, panneau légèrement réduit */
  @media (max-width: 1024px) {
    .gear.g1 { width: 180px; height: 180px; top: 4%;     left: 3%; }
    .gear.g2 { width: 140px; height: 140px; top: 6%;     right: 3%; }
    .gear.g3 { width: 150px; height: 150px; bottom: 8%;  left: 4%; }
    .gear.g4 { width: 200px; height: 200px; bottom: 4%;  right: 3%; }
    .halo    { width: 600px; height: 600px; }
    .skip    { top: 38px; right: 20px; }
  }

  /* Mobile ≤ 768px : panneau compact, engrenages plus petits, ticker remonté */
  @media (max-width: 768px) {
    .panel  { padding: 44px 28px 32px; width: min(560px, 94vw); }
    .title  { font-size: 32px; letter-spacing: 0.16em; }
    .subtitle { font-size: 11px; letter-spacing: 0.34em; margin-bottom: 28px; }
    .id-tag { font-size: 9px; letter-spacing: 0.26em; margin-bottom: 18px; }
    .id-tag::before, .id-tag::after { content: "···"; margin: 0 8px; }
    .logo-wrap { height: 88px; margin-bottom: 22px; }
    .logo { height: 88px; }
    .meta { font-size: 10px; letter-spacing: 0.12em; gap: 6px; flex-wrap: wrap; }
    .gear.g1 { width: 130px; height: 130px; }
    .gear.g2 { width: 100px; height: 100px; }
    .gear.g3 { width: 110px; height: 110px; }
    .gear.g4 { width: 140px; height: 140px; }
    .halo    { width: 460px; height: 460px; }
    .ticker  { bottom: 28px; font-size: 10px; padding: 0 16px; }
    .stripe  { height: 22px; }
  }

  /* Mobile ≤ 480px : très compact + bandes de sécu + skip plus petit */
  @media (max-width: 480px) {
    .panel  { padding: 36px 20px 26px; }
    .title  { font-size: 26px; letter-spacing: 0.12em; }
    .subtitle { font-size: 10px; letter-spacing: 0.28em; margin-bottom: 24px; }
    .logo-wrap { height: 70px; margin-bottom: 18px; }
    .logo { height: 70px; }
    .progress { height: 6px; }
    .meta { font-size: 9px; letter-spacing: 0.10em; }
    .meta b { font-weight: 600; }
    .gear.g1 { width: 100px; height: 100px; opacity: 0; animation: none; }
    .gear.g2 { width: 80px;  height: 80px; }
    .gear.g3 { width: 90px;  height: 90px; opacity: 0; animation: none; }
    .gear.g4 { width: 110px; height: 110px; }
    .halo    { width: 360px; height: 360px; }
    .skip    {
      top: 34px; right: 14px;
      padding: 5px 10px; font-size: 10px;
      letter-spacing: 0.12em;
    }
    .ticker  { bottom: 22px; font-size: 9px; }
    .stripe  { height: 18px; }
    .rivet   { width: 10px; height: 10px; }
    .rivet.tl, .rivet.tr { top: 18px; }
    .rivet.bl, .rivet.br { bottom: 18px; }
  }

  /* Très petit mobile ≤ 360px : panneau ultra-compact */
  @media (max-width: 360px) {
    .panel  { padding: 32px 16px 22px; }
    .title  { font-size: 22px; letter-spacing: 0.10em; }
    .subtitle { font-size: 9px; letter-spacing: 0.24em; margin-bottom: 20px; }
    .logo-wrap { height: 60px; margin-bottom: 16px; }
    .logo { height: 60px; }
    /* En 360px, on cache tous les engrenages décoratifs : trop chargé */
    .gear { display: none; }
    .meta { justify-content: center; row-gap: 4px; }
  }

  /* Mode paysage mobile (hauteur faible) : panneau réduit verticalement */
  @media (orientation: landscape) and (max-height: 500px) {
    .panel  { padding: 28px 32px 22px; width: min(520px, 88vw); }
    .id-tag { margin-bottom: 12px; }
    .logo-wrap { height: 60px; margin-bottom: 14px; }
    .logo { height: 60px; }
    .title { font-size: 22px; margin-bottom: 4px; }
    .subtitle { font-size: 10px; margin-bottom: 16px; }
    .progress { margin-bottom: 10px; }
    .ticker { bottom: 12px; }
    .stripe { height: 16px; }
    .gear.g1, .gear.g3 { display: none; }
  }

  /* Respecter "prefers-reduced-motion" */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>

<body>

<button type="button" class="skip" id="skip-btn" aria-label="Passer l'introduction">
  Skip &gt;&gt;
</button>

<div class="scene" id="scene">

  <span class="stripe top"></span>
  <span class="stripe bottom"></span>

  <div class="grid"></div>
  <div class="halo"></div>

  <!-- Engrenages aux 4 coins -->
  <svg class="gear g1" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(50,50)">
      <circle r="34"/>
      <circle r="14"/>
      {% for i in range(12) %}<rect x="-3" y="-46" width="6" height="11" transform="rotate({{ i*30 }})"/>{% endfor %}
    </g>
  </svg>
  <svg class="gear g2" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(50,50)">
      <circle r="30"/>
      <circle r="10"/>
      {% for i in range(10) %}<rect x="-3" y="-42" width="6" height="10" transform="rotate({{ i*36 }})"/>{% endfor %}
    </g>
  </svg>
  <svg class="gear g3" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(50,50)">
      <circle r="32"/>
      <circle r="12"/>
      {% for i in range(8) %}<rect x="-4" y="-44" width="8" height="11" transform="rotate({{ i*45 }})"/>{% endfor %}
    </g>
  </svg>
  <svg class="gear g4" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(50,50)">
      <circle r="36"/>
      <circle r="16"/>
      {% for i in range(14) %}<rect x="-3" y="-48" width="6" height="11" transform="rotate({{ i*25.71 }})"/>{% endfor %}
    </g>
  </svg>

  <!-- Particules de lumière (boucle infinie) -->
  <span class="particle" style="left: 8%;  --dur: 9s;  --delay: 0.2s; --drift: 40px;"></span>
  <span class="particle" style="left: 18%; --dur: 11s; --delay: 1.4s; --drift: -30px;"></span>
  <span class="particle" style="left: 28%; --dur: 8s;  --delay: 2.8s; --drift: 60px;"></span>
  <span class="particle" style="left: 42%; --dur: 12s; --delay: 0.8s; --drift: -50px;"></span>
  <span class="particle" style="left: 56%; --dur: 10s; --delay: 3.6s; --drift: 35px;"></span>
  <span class="particle" style="left: 68%; --dur: 9s;  --delay: 1.8s; --drift: -45px;"></span>
  <span class="particle" style="left: 78%; --dur: 11s; --delay: 4.2s; --drift: 25px;"></span>
  <span class="particle" style="left: 88%; --dur: 8s;  --delay: 2.2s; --drift: -55px;"></span>

  <!-- Panneau central -->
  <div class="stage">
    <div class="panel">
      <span class="rivet tl"></span>
      <span class="rivet tr"></span>
      <span class="rivet bl"></span>
      <span class="rivet br"></span>

      <div class="id-tag">Système LiuGong · Édition 2026</div>

      <div class="logo-wrap">
        <img class="logo"
             src="{{ url_for('static', path='img/branding/logo_LG_complet.png') }}"
             alt="LiuGong"/>
        <span class="laser"></span>
      </div>

      <h1 class="title">LiuGong <span class="accent">Academy</span></h1>
      <p class="subtitle">Excellence Technique &middot; Afrique</p>

      <div class="progress">
        <span class="progress-tick" style="left: 25%;"></span>
        <span class="progress-tick" style="left: 50%;"></span>
        <span class="progress-tick" style="left: 75%;"></span>
        <div class="progress-fill"></div>
      </div>

      <div class="meta">
        <span><span class="dot"></span> RIG <b>NMB-001</b></span>
        <span>SYS <b id="sys-status">BOOT</b></span>
        <span>VER <b>2026.05</b></span>
      </div>
    </div>
  </div>

  <div class="ticker">
    <span class="pulse">●</span>&nbsp;&nbsp;Initialisation de la plateforme &middot; Veuillez patienter
  </div>
</div>

<script>
  (function () {
    const TOTAL_DURATION = 4500;       /* Durée totale avant redirection */
    const TARGET_URL = "{{ home_url }}";

    const scene = document.getElementById('scene');
    const skip  = document.getElementById('skip-btn');
    const sys   = document.getElementById('sys-status');

    const phases = ['BOOT', 'LOAD', 'INIT', 'SYNC', 'READY'];
    let i = 0;
    const phaseTimer = setInterval(() => {
      i = (i + 1) % phases.length;
      if (sys) sys.textContent = phases[i];
    }, 700);

    function exitToHome() {
      clearInterval(phaseTimer);
      scene.classList.add('is-leaving');
      if (sys) sys.textContent = 'READY';
      setTimeout(() => {
        window.location.replace(TARGET_URL);
      }, 850);
    }

    /* Auto-redirection après TOTAL_DURATION ms */
    const autoTimer = setTimeout(exitToHome, TOTAL_DURATION);

    /* Skip à tout moment */
    skip.addEventListener('click', () => {
      clearTimeout(autoTimer);
      exitToHome();
    });

    /* Touche Échap = skip */
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' || e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        clearTimeout(autoTimer);
        exitToHome();
      }
    });
  })();
</script>
