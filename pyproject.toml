[project]
name = "nemba-report"
version = "0.1.0"
description = "NEMBA GROUP – Générateur de rapports de formation (FastAPI + HTML/CSS/JS)"
requires-python = ">=3.9"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "jinja2",
  "python-multipart",
  "pydantic",
  "pandas",
  "matplotlib",
  "openpyxl",
  "weasyprint; platform_system != 'Windows'",
  "pdfkit",
  "weasyprint>=66.0",
  "reportlab>=4.4.3",
  "cairosvg>=2.8.2",
  "seaborn>=0.13.2",
  "psutil>=5.9.6",
]

[tool.uv]
package = false
