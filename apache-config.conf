# Configuration Apache pour LiuGong Academy
# Fichier : /etc/apache2/sites-available/liugong-academy.conf

<VirtualHost *:80>
    ServerName liugong-academy.local
    ServerAlias www.liugong-academy.local
    DocumentRoot /opt/liugong-academy
    
    # Configuration WSGI
    WSGIDaemonProcess liugong-academy \
        python-path=/opt/liugong-academy \
        python-home=/opt/liugong-academy/venv \
        processes=4 \
        threads=15 \
        maximum-requests=1000 \
        display-name=liugong-academy \
        user=www-data \
        group=www-data
    
    WSGIProcessGroup liugong-academy
    WSGIScriptAlias / /opt/liugong-academy/app.wsgi
    
    # Configuration du répertoire principal
    <Directory /opt/liugong-academy>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
        
        # Sécurité : interdire l'accès aux fichiers sensibles
        <Files "*.py">
            Require all denied
        </Files>
        <Files "*.env">
            Require all denied
        </Files>
        <Files "requirements.txt">
            Require all denied
        </Files>
    </Directory>
    
    # Fichiers statiques (CSS, JS, images)
    Alias /static /opt/liugong-academy/app/static
    <Directory /opt/liugong-academy/app/static>
        Require all granted
        
        # Cache pour les fichiers statiques
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
        
        # Compression
        <IfModule mod_deflate.c>
            SetOutputFilter DEFLATE
            SetEnvIfNoCase Request_URI \
                \.(?:gif|jpe?g|png)$ no-gzip dont-vary
            SetEnvIfNoCase Request_URI \
                \.(?:exe|t?gz|zip|bz2|sit|rar)$ no-gzip dont-vary
        </IfModule>
    </Directory>
    
    # Uploads (fichiers temporaires)
    Alias /uploads /var/lib/liugong-academy/uploads
    <Directory /var/lib/liugong-academy/uploads>
        Require all granted
        
        # Sécurité : interdire l'exécution de scripts
        Options -ExecCGI
        AddHandler cgi-script .php .pl .py .jsp .asp .sh .cgi
        <Files "*.php">
            Require all denied
        </Files>
        <Files "*.py">
            Require all denied
        </Files>
    </Directory>
    
    # Configuration des uploads
    LimitRequestBody 52428800  # 50MB max
    
    # Headers de sécurité
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Logs
    ErrorLog ${APACHE_LOG_DIR}/liugong-academy_error.log
    CustomLog ${APACHE_LOG_DIR}/liugong-academy_access.log combined
    
    # LogLevel pour le débogage (à réduire en production)
    LogLevel info
    
    # Timeouts
    Timeout 300
    KeepAliveTimeout 5
    MaxKeepAliveRequests 100
</VirtualHost>

# Configuration HTTPS (après installation du certificat SSL)
<VirtualHost *:443>
    ServerName liugong-academy.local
    ServerAlias www.liugong-academy.local
    DocumentRoot /opt/liugong-academy
    
    # Configuration SSL
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/liugong-academy.crt
    SSLCertificateKeyFile /etc/ssl/private/liugong-academy.key
    
    # Configuration WSGI (identique au VirtualHost HTTP)
    WSGIDaemonProcess liugong-academy-ssl \
        python-path=/opt/liugong-academy \
        python-home=/opt/liugong-academy/venv \
        processes=4 \
        threads=15 \
        maximum-requests=1000 \
        display-name=liugong-academy-ssl \
        user=www-data \
        group=www-data
    
    WSGIProcessGroup liugong-academy-ssl
    WSGIScriptAlias / /opt/liugong-academy/app.wsgi
    
    # Configuration identique au VirtualHost HTTP
    <Directory /opt/liugong-academy>
        WSGIApplicationGroup %{GLOBAL}
        Require all granted
        
        <Files "*.py">
            Require all denied
        </Files>
        <Files "*.env">
            Require all denied
        </Files>
        <Files "requirements.txt">
            Require all denied
        </Files>
    </Directory>
    
    Alias /static /opt/liugong-academy/app/static
    <Directory /opt/liugong-academy/app/static>
        Require all granted
        ExpiresActive On
        ExpiresByType text/css "access plus 1 month"
        ExpiresByType application/javascript "access plus 1 month"
        ExpiresByType image/png "access plus 1 month"
        ExpiresByType image/jpg "access plus 1 month"
        ExpiresByType image/jpeg "access plus 1 month"
        ExpiresByType image/svg+xml "access plus 1 month"
    </Directory>
    
    Alias /uploads /var/lib/liugong-academy/uploads
    <Directory /var/lib/liugong-academy/uploads>
        Require all granted
        Options -ExecCGI
        AddHandler cgi-script .php .pl .py .jsp .asp .sh .cgi
        <Files "*.php">
            Require all denied
        </Files>
        <Files "*.py">
            Require all denied
        </Files>
    </Directory>
    
    # Headers de sécurité HTTPS
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options DENY
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    
    # Logs HTTPS
    ErrorLog ${APACHE_LOG_DIR}/liugong-academy_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/liugong-academy_ssl_access.log combined
    
    LogLevel info
    Timeout 300
    KeepAliveTimeout 5
    MaxKeepAliveRequests 100
</VirtualHost>

# Redirection HTTP vers HTTPS (optionnel)
<VirtualHost *:80>
    ServerName liugong-academy.local
    Redirect permanent / https://liugong-academy.local/
</VirtualHost>
